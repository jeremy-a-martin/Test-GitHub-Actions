name: Build Docker Image

on:
  # Allow manual triggering of the workflow
  workflow_dispatch:
  schedule:
    # Runs every 5 minutes test
    - cron: '*/5 * * * *'

jobs:
  test-build:
    runs-on: ubuntu-latest

    env:
      IMG_NAME: 'ignition-image'
      FOLDER_NAME: 'dockerfiles/ignition'
      REPO_URL: 'test_url'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: build image
        run: |
          cd $FOLDER_NAME
          docker build -t $REPO_URL/$IMG_NAME:$GITHUB_SHA -t $REPO_URL/$IMG_NAME:latest .
          docker images